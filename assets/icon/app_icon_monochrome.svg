    <path d="M 44 96 C 44 142, 78 168, 120 168 C 162 168, 196 142, 196 96" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <path d="M 120 162 C 100 138, 142 116, 118 90 C 98 69, 138 55, 121 38" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="120" cy="196" r="10" fill="#FFFFFF"/>
  </g>
</svg>
