<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Android 13+ themed icon. The launcher recolours this to match the user's
    wallpaper palette, so only the alpha channel carries information — the mark
    is drawn flat white and the brass dot loses its colour by design.
  -->
